[package]
name = "p2pbot-core"
description = "The Saturn P2P bot kit's core in Rust: pins, swap secrets, keys, and every byte the kit signs on Phantasma and Base. no_std, for boards and microcontrollers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
